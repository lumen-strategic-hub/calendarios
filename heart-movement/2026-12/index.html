<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow, noarchive">
<title>Calendário Heart Dezembro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 1) Visão do mês = objetivo + leitura do mês + legenda de objetivos/formatos/estruturas + calendário do mês (ícone do formato na cor do objetivo + código da estrutura) + distribuição por objetivo + lista dos posts. 2) Post selecionado, com todos os campos editáveis, decisão (aprovar/ajustar) e comentário. 3) Pra decidir + material que falta. Edições gravadas no banco do artefato. */
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --ink:#1A1D26; --muted:#606676; --line:#CDD1DA; --weekend:#ECEEF2; --soft:#F0F1F4;
  --accent:#B9790B; --accent-soft:#FBF1DC; --no:#B4442E; --no-soft:#F9E7E3; --yes:#18877A; --yes-soft:#E0F2EF; --warn:#9A6B00; --warn-soft:#FFF4D6;
  /* cores fixas dos 9 objetivos da Biblioteca de Objetivos (iguais em todos os clientes) */
  --f-reels:#C0392B; --f-carrossel:#2E6FB2; --f-card:#7B57C9; --f-stories:#1B8A7D;
  --o-vender:#C28A00; --o-autoridade:#2E6FB2; --o-conexao:#D2556B; --o-educar:#1B8A7D; --o-desejo:#7B57C9; --o-objecao:#B5452C; --o-burburinho:#A63AA0; --o-base:#4E8F2A; --o-entreter:#1098A8; --o-outro:#8A8F9C;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12141A; --surface:#1B1E26; --ink:#ECEDF1; --muted:#9AA0AF; --line:#3A3F4C; --weekend:#20242D; --soft:#232732;
  --accent:#E3A93E; --accent-soft:#3A2E17; --no:#E58A75; --no-soft:#3D221D; --yes:#4FC2B2; --yes-soft:#15332F; --warn:#E6B84A; --warn-soft:#3A3014;
  --f-reels:#EF8A7C; --f-carrossel:#6FA8E6; --f-card:#A98FEA; --f-stories:#4FC2B2;
  --o-vender:#E8B13A; --o-autoridade:#6FA8E6; --o-conexao:#EF8AA0; --o-educar:#4FC2B2; --o-desejo:#A98FEA; --o-objecao:#E8876C; --o-burburinho:#D77BD0; --o-base:#8CC95E; --o-entreter:#5BC6D6; --o-outro:#9AA0AF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141A; --surface:#1B1E26; --ink:#ECEDF1; --muted:#9AA0AF; --line:#3A3F4C; --weekend:#20242D; --soft:#232732;
  --accent:#E3A93E; --accent-soft:#3A2E17; --no:#E58A75; --no-soft:#3D221D; --yes:#4FC2B2; --yes-soft:#15332F; --warn:#E6B84A; --warn-soft:#3A3014;
  --f-reels:#EF8A7C; --f-carrossel:#6FA8E6; --f-card:#A98FEA; --f-stories:#4FC2B2;
  --o-vender:#E8B13A; --o-autoridade:#6FA8E6; --o-conexao:#EF8AA0; --o-educar:#4FC2B2; --o-desejo:#A98FEA; --o-objecao:#E8876C; --o-burburinho:#D77BD0; --o-base:#8CC95E; --o-entreter:#5BC6D6; --o-outro:#9AA0AF; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px;padding-block:26px 64px;display:grid;gap:26px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit}
.topline{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.brand{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);letter-spacing:.05em}
.modo{font-size:.85rem;color:var(--muted);display:inline-flex;align-items:center;gap:8px}
.modo i{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.modo.on i{background:var(--yes)}
.modo.off i{background:var(--no)}
.label{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* ---------- Visão do mês ---------- */
.visao{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:grid}
/* 04/11/2026: navegação entre meses no mesmo link (pedido da Ju) */
.meses-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.meses-nav a,.meses-nav span{font:600 14px/1.2 inherit;text-decoration:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.meses-nav a:hover{border-color:var(--accent);color:var(--accent)}
.meses-nav .atual{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.meses-nav .vazio{visibility:hidden}
.meses-nav .lista{display:flex;gap:6px;flex-wrap:wrap}
.head{background:var(--ink);color:var(--bg);padding:24px 26px;display:grid;gap:18px}
.head .mes{font-family:var(--f-mono);font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;opacity:.7}
.head h1{font-size:clamp(1.6rem,4vw,2.2rem);line-height:1.05}
.head .obj{font-size:1.08rem;max-width:62ch}
.strat{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px 28px;border-top:1px solid color-mix(in srgb,var(--bg) 22%,transparent);padding-top:16px}
.strat div{display:grid;gap:4px;min-width:0;align-content:start}
.strat span{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;opacity:.65;font-weight:700}
.strat p{font-size:.95rem;opacity:.92}
.placar{display:flex;gap:16px;flex-wrap:wrap;font-size:.9rem;opacity:.9}
.placar b{font-variant-numeric:tabular-nums}

.bloco{padding:18px 26px 6px;display:grid;gap:10px}
.bloco + .bloco{border-top:1px solid var(--line);margin-top:12px}
.bar{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.9rem;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend b{font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.fmts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.9rem;align-items:center}
.fmts span{display:inline-flex;align-items:center;gap:6px}
.fmts svg{width:18px;height:18px}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.estr{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem}
.estr span{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.estr code{font-family:var(--f-mono);font-size:.72rem;font-weight:500;background:var(--soft);border-radius:5px;padding:1px 6px;color:var(--ink)}

/* checks, um de cada vez */
.pedidos{border-top:1px solid var(--line);background:var(--warn-soft)}
.pedido{all:unset;cursor:pointer;display:grid;gap:2px;padding:8px 10px;border-radius:8px;border:1px solid transparent}
.pedido:hover,.pedido:focus-visible{border-color:var(--warn)}
.pedido b{font-size:.95rem}
.pedido span{font-size:.9rem;color:var(--muted)}
.pedidos .nota{font-size:.82rem;color:var(--muted)}
.checks{scroll-margin-top:12px;padding:18px 26px 10px;display:grid;gap:14px;border-top:1px solid var(--line)}
.passos{display:flex;flex-wrap:wrap;gap:6px}
.passos button{all:unset;cursor:pointer;font-size:.85rem;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:6px 14px;color:var(--muted)}
.passos button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.passos button.feito:not([aria-selected="true"]){color:var(--yes);border-color:var(--yes)}
.passos button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.passo-head{display:grid;gap:2px}
.passo-head h2{font-size:1.25rem}
.passo-head p{font-size:.9rem;color:var(--muted)}
.resumo{display:grid;gap:10px}
.passo-nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;padding-top:4px}
.passo-nav .btns{display:flex;gap:8px}
.passo-nav button{font-weight:600;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer}
.passo-nav button:disabled{opacity:.35;cursor:default}
.passo-nav button.chk.on{background:var(--yes-soft);border-color:var(--yes);color:var(--yes)}
.passo-nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.aprovacal{margin:14px 0 4px;padding:14px 16px;border:1.5px solid var(--yes);border-radius:14px;background:var(--yes-soft);display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.aprovacal p{margin:0;flex:1 1 320px;line-height:1.45}
.aprovacal button{all:unset;cursor:pointer;font-weight:800;border-radius:999px;padding:10px 20px;background:var(--yes);color:#fff;white-space:nowrap}
.aprovacal button:disabled{opacity:.45;cursor:default}
.aprovacal button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.aprovacal.done{border-color:var(--line);background:var(--surface)}
.cell .add{all:unset;cursor:pointer;font-size:.95rem;line-height:1;color:var(--accent);opacity:.35;padding:0 2px}
.cell:hover .add,.cell .add:focus-visible{opacity:1}
.cell .addhint{font-size:.66rem;color:var(--accent);opacity:0;align-self:end}
.cell.livre:hover .addhint{opacity:.8}
.cell.aberta{grid-template-rows:auto auto;min-height:140px;background:var(--accent-soft);outline:1.5px solid var(--accent)}
.addf{display:grid;gap:4px;width:100%;justify-items:stretch;font-size:.72rem}
.addf b{font-size:.7rem;color:var(--accent)}
.addf input,.addf select{font:inherit;font-size:.72rem;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);width:100%}
.addf .bt{display:flex;gap:4px}
.addf button{all:unset;cursor:pointer;font-weight:700;font-size:.7rem;border-radius:999px;padding:4px 10px;background:var(--accent);color:#fff;flex:1;text-align:center}
.addf button.x{background:var(--surface);color:var(--muted);border:1px solid var(--line);flex:0 0 auto}
.addf .aviso{font-size:.66rem;color:var(--muted)}
.novo{margin:14px 0 4px;border:1.5px solid var(--accent);border-radius:14px;padding:12px 16px;background:var(--accent-soft)}
.novo summary{cursor:pointer;font-weight:800;font-size:1.05rem;color:var(--accent)}
.novo summary small{font-weight:500;font-size:.85rem;color:var(--muted)}
.novo-form{display:flex;gap:10px;flex-wrap:wrap;align-items:end;padding:10px 0 4px}
.novo-form label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
.novo-form label.wide{flex:1 1 260px}
.novo-form input,.novo-form select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.novo-form button{all:unset;cursor:pointer;font-weight:700;border-radius:999px;padding:8px 16px;background:var(--accent);color:#fff}
.novo-form .aviso{font-size:12px;color:var(--muted)}
.cell .txt{display:grid;gap:3px;font-size:.72rem;font-weight:700;line-height:1.15;text-align:left;color:var(--cor);align-self:start;padding:2px 0;overflow-wrap:anywhere;width:100%}
.cell .dim{display:block}
.cell .tema{display:block;font-size:.68rem;font-weight:500;color:var(--ink);line-height:1.2;overflow-wrap:anywhere}
.cell.p-dias .tema{font-weight:600}
.cell.p-dias{background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.cell.p-formato{background:color-mix(in srgb,var(--cor) 12%,var(--surface))}
.cell.p-objetivo{background:color-mix(in srgb,var(--cor) 10%,var(--surface))}
.cell.p-estrutura .txt{color:var(--ink);font-weight:600}
/* calendário do mês */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dw{font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:2px;font-weight:700}
.cell{all:unset;box-sizing:border-box;min-height:84px;border-radius:9px;padding:6px 6px 5px;display:grid;grid-template-rows:auto 1fr;justify-items:center;gap:2px;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums;background:var(--soft)}
.cell.we{background:var(--weekend);opacity:.75}
.cell.vazio{visibility:hidden}
.cell.post{color:var(--ink);font-weight:700;background:var(--surface);border:1px solid var(--line);grid-template-rows:auto;align-content:start;gap:4px}
.cell.post .top{margin-bottom:0}
.ent{all:unset;cursor:pointer;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 4px;width:100%;border-radius:7px;padding:3px 4px;border:1.5px solid transparent}
.ent .dec{grid-column:2;grid-row:1;font-size:.7rem;line-height:1}
.ent .txt{grid-column:1 / span 2}
.ent:hover{border-color:var(--cor)}
.ent[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.ent:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.cell.dupla .ent{border-color:color-mix(in srgb,var(--line) 60%,transparent)}
.cell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cell .n{justify-self:start;line-height:1}
.tile{position:relative;width:34px;height:34px;border-radius:9px;background:color-mix(in srgb,var(--cor) 18%,transparent);color:var(--cor);display:grid;place-items:center;align-self:center}
.tile .ic{width:20px;height:20px}
.tile .o2{position:absolute;right:-3px;top:-3px;width:11px;height:11px;border-radius:50%;background:var(--cor2);border:2px solid var(--surface)}
.cell .cod{font-family:var(--f-mono);font-size:.62rem;font-weight:500;color:var(--muted);letter-spacing:.02em}
.cell .st{position:absolute}
.cell .dec{justify-self:end;font-size:.7rem;line-height:1}
.cell .top{display:flex;justify-content:space-between;width:100%;align-items:center}

/* distribuição por objetivo */
.dist{display:grid;gap:6px}
.dist .row2{display:grid;grid-template-columns:200px minmax(0,1fr);gap:10px;align-items:center;font-size:.88rem}
.dist .nome{display:inline-flex;align-items:center;gap:7px;min-width:0}
.dist .nome b{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.dias{display:flex;flex-wrap:wrap;gap:4px}
.dia{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:.72rem;padding:1px 7px;border-radius:99px;background:color-mix(in srgb,var(--cor) 16%,transparent);color:var(--ink);font-variant-numeric:tabular-nums}
.dia.seg{box-shadow:inset 0 0 0 1.5px var(--warn)}
.dia:focus-visible{outline:2px solid var(--accent)}
.ent{-webkit-user-drag:none;user-select:none;-webkit-user-select:none}.ent.arrastavel{cursor:grab}.ent.arrastando{opacity:.35}.ent.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:999;opacity:.9;box-shadow:0 8px 24px rgba(0,0,0,.25);transform:rotate(-2deg)}.cell.alvo{outline:2px dashed var(--accent);outline-offset:-2px;background:color-mix(in srgb,var(--accent) 12%,transparent)}
.dist .nota{font-size:.82rem;color:var(--muted)}
.dist .nota b{color:var(--warn)}

/* lista */
.filtro{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:14px 26px 0}
.filtro button{all:unset;cursor:pointer;font-size:.85rem;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--muted)}
.filtro button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filtro button b{font-variant-numeric:tabular-nums}
.filtro button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.list{padding:10px 14px 16px;display:grid;gap:2px}
.row{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:92px 44px 190px minmax(0,1fr) 34px;gap:14px;align-items:start;padding:12px;border-radius:12px;border:1.5px solid transparent}
.row:hover{background:var(--bg)}
.row[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row .day{display:grid}
.row .dwl{font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.row .dn{font-family:var(--f-display);font-weight:700;font-size:1.35rem;line-height:1.1;font-variant-numeric:tabular-nums}
.row .gap{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.row .kind{display:grid;gap:5px;justify-items:start}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;border-radius:99px;padding:2px 10px 2px 8px;background:color-mix(in srgb,var(--cor) 16%,transparent);color:var(--ink);max-width:100%}
.chip .dot{background:var(--cor);width:8px;height:8px}
.row .fmt{font-size:.82rem;color:var(--muted)}
.row .what{display:grid;gap:3px;min-width:0}
.row .t{font-weight:700;font-size:1.02rem}
.row .w{font-size:.9rem;color:var(--muted)}
.row .tile{width:38px;height:38px;border-radius:10px}
.row .tile .ic{width:22px;height:22px}
.row .st{font-size:1rem;justify-self:end;text-align:right;line-height:1.3}
.hintline{padding:0 26px 18px;font-size:.85rem;color:var(--muted)}
.edit-mark{color:var(--accent);font-weight:700}

/* ---------- Post selecionado (abre logo abaixo de onde foi clicado) ---------- */
.slot{grid-column:1 / -1}
.slot:empty{display:none}
.slot .brief,.list .brief{margin:6px 0 10px}
#brief-holder:empty{display:none}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px 28px;display:grid;gap:22px;scroll-margin-top:12px}
.brief-head{display:grid;gap:10px;border-bottom:1px solid var(--line);padding-bottom:18px}
.brief-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.fechar-topo{all:unset;cursor:pointer;font-weight:700;font-size:.82rem;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.fechar-topo:hover{border-color:var(--ink)}.fechar-topo:focus-visible{outline:2px solid var(--accent)}
.brief-head .meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.9rem;color:var(--muted);align-items:center}
.brief-head .meta b{color:var(--ink);font-weight:600}
.brief-head h2{font-size:clamp(1.3rem,3vw,1.75rem);line-height:1.15}
.campo{display:grid;gap:8px;min-width:0}
.campo .lbl{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.campo .lbl .orig{all:unset;cursor:pointer;font-size:.78rem;color:var(--accent);font-weight:600}
.campo .lbl .orig:focus-visible{outline:2px solid var(--accent);border-radius:4px}
.campo input[type=date]{width:auto;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.campo input[type=date]:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.campo textarea,.campo input[type=text],.campo select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical;min-height:44px;field-sizing:content}
.campo textarea:focus,.campo input:focus,.campo select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.campo.mudou textarea,.campo.mudou input,.campo.mudou select,.campo.mudou .seg{box-shadow:inset 3px 0 0 var(--accent)}
.campo .was{font-size:.82rem;color:var(--muted);font-style:italic}
.campo .ro{font-size:.95rem;color:var(--muted)}
.opcoes{display:grid;gap:6px}
.opc{all:unset;cursor:pointer;display:grid;gap:3px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.98rem;line-height:1.35}
.opc .num{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.opc[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opc:hover{border-color:var(--accent)}
.opc:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opc:disabled{cursor:default}

  // ---------- navegação ----------
  function colocaBrief(){
    var b = document.getElementById('brief'), h = document.getElementById('brief-holder'); if (!b || !h) return;
    if (!aberto){ b.hidden = true; if (b.parentNode !== h) h.appendChild(b); return; }
    b.hidden = false;
    if (origem === 'row'){ var r = document.querySelector('.row[data-i="'+sel+'"]'); if (r){ r.insertAdjacentElement('afterend', b); return; } }
    var ent = document.querySelector('.ent[data-i="'+sel+'"]');
    if (ent){ var slot = document.querySelector('.slot[data-semana="'+ent.dataset.semana+'"]'); if (slot){ slot.appendChild(b); return; } }
    var r2 = document.querySelector('.row[data-i="'+sel+'"]'); if (r2){ r2.insertAdjacentElement('afterend', b); return; }
    h.appendChild(b);
  }
  function renderTopoSeguro(){ if (briefTemFoco()) { topoPendente = true; return; } renderTopo(); }
  function mark(){ document.querySelectorAll('.row,.ent').forEach(function(n){ n.setAttribute('aria-pressed', String(+n.dataset.i===sel)); }); }
  function go(i,scroll){
    if(i<0||i>=P.length) return; sel=i; aberto = true; mark(); renderBrief(); colocaBrief();
    try{ document.getElementById('brief').scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth', block:'nearest'}); }catch(e){}
  }
  function fechaBrief(){ aberto = false; colocaBrief(); }

  app.innerHTML = '<div class="topline"><span class="brand">LUMEN STRATEGIC HUB · CALENDÁRIO MACRO PRA APROVAR</span><span class="modo" id="modo"><i></i>carregando…</span></div><div id="topo"></div><div id="brief-holder"><article class="brief" id="brief" aria-live="polite" hidden></article></div><section class="decidir" id="decidir"></section><div id="aprova-holder"></div>';
  app.addEventListener('click', function(e){
    var f = e.target.closest('[data-filtro]'); if (f){ filtro = f.dataset.filtro; renderTopo(); return; }
    var b = e.target.closest('[data-passo]'); if (b){ var np=+b.dataset.passo; if(np>=0&&np<6){ passo=np; try{ localStorage.setItem('passo',String(np)); }catch(x){} renderTopo(); try{ document.querySelector('.checks').scrollIntoView({block:'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}); }catch(x){} } return; }
    var ac = e.target.closest('[data-aprova-cal]'); if (ac){ aprovaCalendario(); return; }
    var np = e.target.closest('[data-novo-post]'); if (np){ novoPost(); return; }
    var fx = e.target.closest('[data-fechar]'); if (fx){ fechaBrief(); return; }
    var ad = e.target.closest('[data-add]'); if (ad){ abreAddNoDia(ad.dataset.add); return; }
    var ac2 = e.target.closest('[data-add-cancel]'); if (ac2){ renderTopo(); return; }
    if (e.target.closest('.addf')) return;
    var c = e.target.closest('[data-chk]'); if (c){ var k=c.dataset.chk; CHK[k] = !CHK[k]; renderTopo(); if (db || API) escreve('checks/geral', Object.assign({}, CHK, {atualizadoEm: new Date().toISOString()}), {semNotion:true}); return; }
    if (ARRASTOU && Date.now() - ARRASTOU < 500) return;
    var n=e.target.closest('.row,.ent,.dia,.pedido'); if(n && n.dataset.i!=null){ origem = n.classList.contains('row') ? 'row' : 'cal'; go(+n.dataset.i,true); }
  });
  // Arrastar e soltar no calendário (pedido da Denise, 19/10/2026): segura o post com o mouse, leva pra outro dia e solta; a data grava no Notion sozinha.
  // Feito com pointer events (não com o drag nativo): o nativo não funciona em botão no Safari. Toque (celular/tablet) continua clique + campo de data.
  var DR = null, ARRASTOU = 0;
  function celulaEm(x, y){ var el = document.elementFromPoint(x, y); return el && el.closest ? el.closest('.cell[data-dia]') : null; }
  function moveGhost(x, y){ if (DR && DR.ghost) DR.ghost.style.transform = 'translate('+(x - DR.dx)+'px,'+(y - DR.dy)+'px) rotate(-2deg)'; }
  function iniciaArrasto(e){ var r = DR.el.getBoundingClientRect(); DR.dx = DR.x - r.left; DR.dy = DR.y - r.top; DR.ativo = true; DR.el.classList.add('arrastando'); var g = DR.el.cloneNode(true); g.classList.remove('arrastando'); g.classList.add('ghost'); g.style.width = r.width+'px'; document.body.appendChild(g); DR.ghost = g; moveGhost(e.clientX, e.clientY); }
  function limpaArrasto(){ if (!DR) return; var d = DR; DR = null; if (d.ghost) d.ghost.remove(); d.el.classList.remove('arrastando'); document.querySelectorAll('.cell.alvo').forEach(function(n){ n.classList.remove('alvo'); }); return d; }
  document.addEventListener('pointerdown', function(e){ if (modo!=='edita' || e.button !== 0 || e.pointerType === 'touch') return; var n = e.target.closest && e.target.closest('.ent.arrastavel'); if (!n) return; DR = { i: +n.dataset.i, el: n, x: e.clientX, y: e.clientY, ativo: false }; });
  document.addEventListener('pointermove', function(e){ if (!DR) return; if (!DR.ativo){ if (Math.hypot(e.clientX - DR.x, e.clientY - DR.y) < 6) return; iniciaArrasto(e); } e.preventDefault(); moveGhost(e.clientX, e.clientY); var c = celulaEm(e.clientX, e.clientY); document.querySelectorAll('.cell.alvo').forEach(function(n){ if (n !== c) n.classList.remove('alvo'); }); if (c) c.classList.add('alvo'); }, { passive: false });
  document.addEventListener('pointerup', function(e){ if (!DR) return; var d = limpaArrasto(); if (!d.ativo) return; ARRASTOU = Date.now(); var c = celulaEm(e.clientX, e.clientY); if (!c) return; var dia = c.dataset.dia, p = P[d.i]; if (!p || !/^\d{4}-\d{2}-\d{2}$/.test(dia) || dia === eff(p).data) return; setCampo(p, 'data', dia===p.data ? null : dia); renderBrief(); renderTopo(); });
  document.addEventListener('pointercancel', function(){ limpaArrasto(); });
  window.addEventListener('blur', function(){ limpaArrasto(); });
  renderTopo(); renderBrief(); renderDecidir();
  document.addEventListener('focusout', function(){ setTimeout(function(){ if (topoPendente && !briefTemFoco()) renderTopo(); }, 0); });

  // ===== camada de dados pelo n8n (16/10/2026): a página lê o Notion AO VIVO ao abrir e grava direto, sem login no claude.ai =====
  var TOCADOS = {};
  var API = D.api || '';
  var MES = (D.ano && D.mesNumero) ? (D.ano + '-' + two(+D.mesNumero)) : '';
  var DEC_MAP = {'✅ Aprovado':'aprovado', '✍️ Validado pela copy':'validado', '🔁 Ajustar':'ajustar'};
  var CAMPOS_VIVOS = ['data','tema','formato','estrutura','objetivo','gancho','cta','nivel','tipoCta','palavraChave'];
  function apiGet(){ return fetch(API + '/artefato/calendario?cliente=' + encodeURIComponent(D.idCliente||'') + '&mes=' + MES + '&t=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.json(); }); }
  function apiPost(body){ return fetch(API + '/artefato/grava', {method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(Object.assign({cliente: D.idCliente||'', mes: MES, resumo: D.notion||''}, body))}).then(function(r){ return r.json(); }); }
  function aplicaVivo(res){
    var vistos = {};
    (res.posts||[]).forEach(function(c){
      vistos[c.id] = 1; var p = byId[c.id];
      if (!p){ p = {id:c.id, link:'https://app.notion.com/p/'+c.id, porque:'', dependeDe:'', ganchos:[], data:c.data, tema:c.tema, formato:c.formato, estrutura:c.estrutura, objetivo:c.objetivo, gancho:c.gancho, cta:c.cta, nivel:c.nivel, angulo:c.angulo}; adicionaPost(p); }
      if (p.tipoCta === undefined) p.tipoCta = c.tipoCta || ''; if (p.palavraChave === undefined) p.palavraChave = c.palavraChave || '';
      var r = REV[c.id] = REV[c.id] || {}; r.campos = r.campos || {};
      CAMPOS_VIVOS.forEach(function(k){ var v = c[k]; if (v === undefined || v === null) return; if (k==='objetivo' && !Array.isArray(v)) v = v ? [v] : []; var orig = p[k]; if (k==='objetivo' && !Array.isArray(orig)) orig = orig ? [orig] : []; if (JSON.stringify(v) !== JSON.stringify(orig)) { if (!(TOCADOS[c.id]||{})[k]) r.campos[k] = v; } else if (!(TOCADOS[c.id]||{})[k]) delete r.campos[k]; });
      if (Array.isArray(c.ganchos) && c.ganchos.length >= 2) p.ganchos = c.ganchos;
      p.macro = c.macro || ''; p.cardNome = c.cardNome || p.cardNome; if (c.campanha) p.campanha = c.campanha; if (c.angulo) p.angulo = c.angulo;
      r.decisao = DEC_MAP[c.macro] || '';
      if (c.obs !== undefined){ var m1 = /Denise:\s*([\s\S]*?)(?=\n\nCopy:|$)/.exec(c.obs||''); var m2 = /Copy:\s*([\s\S]*?)$/.exec(c.obs||''); r.comentario = m1 ? m1[1].trim() : ''; r.respostaCopy = m2 ? m2[1].trim() : ''; }
      r.notion = {campos: Object.assign({}, r.campos), decisao: r.decisao, comentario: c.obs||''};
    });
    for (var i = P.length-1; i >= 0; i--){ if (/^[0-9a-f]{32}$/.test(P[i].id) && !vistos[P[i].id]) { delete byId[P[i].id]; P.splice(i,1); } }
    var e = res.estado || {}; var ck = e.checks || {};
    CHK = {dias:!!ck.dias, formato:!!ck.formato, objetivo:!!ck.objetivo, estrutura:!!ck.estrutura, cta:!!ck.cta, aprovadoEm: e.aprovadoEm||''};
    Object.keys(e.decisoes||{}).forEach(function(q){ DEC[q] = {resposta: e.decisoes[q], notion: e.decisoes[q]}; });
    if (sel >= P.length) sel = 0;
  }
  function escreve(path, data, opts){
    if (!API) return escreveDb(path, data, opts);
    var prev = filaEscrita[path] || Promise.resolve();
    filaEscrita[path] = prev.then(function(){
      if (path.indexOf('revisao/')===0){ var id = path.slice(8); var p = byId[id]; var orig = {}; if (p) CAMPOS_VIVOS.forEach(function(k){ orig[k] = p[k]; });
        return apiPost({tipo:'revisao', id:id, campos: data.campos||{}, original: orig, tocados: Object.keys(TOCADOS[id]||{}), decisao: data.decisao||'', comentario: (TOCADOS[id]||{}).comentario ? (data.comentario||'') : undefined, respostaCopy: (TOCADOS[id]||{}).respostaCopy ? (data.respostaCopy||'') : undefined}); }
      if (path === 'checks/geral') return apiPost({tipo:'estado', checks:{dias:!!data.dias, formato:!!data.formato, objetivo:!!data.objetivo, estrutura:!!data.estrutura, cta:!!data.cta}, aprovadoEm: data.aprovadoEm||''});
      if (path.indexOf('decisoes/')===0){ var qid = path.slice(9); var q = (D.decidir||[]).filter(function(x){ return x.id===qid; })[0]; return apiPost({tipo:'decisao', qid:qid, pergunta: q ? q.pergunta : '', resposta: data.resposta||''}); }
      return null;
    }).then(function(r){ if (r && r.ok === false) aviso('não salvou: ' + (r.erro||'erro')); else if (r) aviso('salvo no Notion ✓'); }).catch(function(e){ aviso('não salvou agora (' + ((e && e.message) || 'rede') + '). Tente de novo.'); });
  }
  async function novoPost(){
    if (!API) return novoPostMcp();
    var data = (document.getElementById('nv-data')||{}).value || '', fmt = (document.getElementById('nv-fmt')||{}).value || 'Carrossel', tema = ((document.getElementById('nv-tema')||{}).value || '').trim();
    var av = document.getElementById('nv-aviso'); var say = function(t){ if (av) av.textContent = t; };
    if (!/^\d{4}-\d{2}-\d{2}$/.test(data)) { say('Escolha a data.'); return; }
    if (!tema) { say('Diga o tema do post.'); return; }
    say('criando o card no Notion…');
    try { var r = await apiPost({tipo:'novo', data:data, formato:fmt, tema:tema}); if (!r || !r.ok || !r.id) { say('Não criou: ' + ((r && r.erro) || 'erro')); return; }
      adicionaPost({id:r.id, data:data, link:'https://app.notion.com/p/'+r.id, campanha:'', objetivo:[], tema:tema, angulo:'', formato:fmt, estrutura:'', gancho:'', ganchos:[], cta:'', nivel:'', porque:'Adicionado pela estrategista no artefato.', dependeDe:'', macro:'✍️ Validado pela copy', cardNome:tema, novo:true});
      REV[r.id] = {campos:{}, decisao:'validado', notion:{campos:{}, decisao:'validado', comentario:''}}; say('card criado ✓'); renderTopo();
    } catch(e){ say('Não criou agora (' + ((e && e.message) || 'rede') + ').'); }
  }
  function aprovaCalendario(){
    if (!API) return aprovaCalendarioDb();
    if (modo !== 'edita') return;
    var pend = P.filter(function(p){ var d = decisao(p); return d !== 'aprovado' && d !== 'ajustar'; });
    var nJ = P.filter(function(p){ return decisao(p) === 'ajustar'; }).length;
    if (!pend.length) return;
    if (!confirm('Aprovar o calendário inteiro?\n\n' + pend.length + ' posts vão pra produção: a IA escreve a copy no Notion e a Ju revisa.' + (nJ ? '\n' + nJ + ' com pedido de ajuste ficam de fora.' : ''))) return;
    aviso('gravando no Notion…');
    apiPost({tipo:'aprova-tudo', ids: pend.map(function(p){ return p.id; })}).then(function(r){
      if (!r || !r.ok) { aviso('não aprovou: ' + ((r && r.erro) || 'erro')); return; }
      pend.forEach(function(p){ var x = REV[p.id] = REV[p.id] || {}; x.decisao = 'aprovado'; }); CHK.aprovadoEm = r.aprovadoEm || new Date().toISOString();
      renderTopo(); if (aberto) renderBrief(); aviso('Notion ✓ · produção começa em até 10 min');
    }).catch(function(e){ aviso('não aprovou agora (' + ((e && e.message) || 'rede') + ').'); });
  }
  async function initDb(){
    if (!API) return initDbOriginal();
    try {
      var res = await apiGet();
      if (!res || !res.ok) { API = ''; return initDbOriginal(); }
      aplicaVivo(res);
      setModo('edita', 'Lendo o Notion ao vivo (' + new Date(res.lidoEm).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}) + '). Tudo o que você muda aqui vai direto pro card. Sem login.');
      renderTopo(); renderBrief(); renderDecidir();
      setInterval(function(){ if (briefTemFoco() || decidirTemFoco() || document.querySelector('.addf')) return; apiGet().then(function(r){ if (r && r.ok) { aplicaVivo(r); renderTopo(); } }).catch(function(){}); }, 120000);
    } catch(e){ API = ''; return initDbOriginal(); } // dentro do claude.ai o sandbox bloqueia a chamada externa: volta pro modo com login (db + conector)
  }
  initDb();
})();
</script>
